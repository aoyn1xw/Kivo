name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Serialize rolling `latest` release updates across release.yml and ios-ota.yml.
concurrency:
  group: latest-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tags must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            }

            $version = $Matches.version
          } else {
            [xml] $props = Get-Content -Raw "Directory.Build.props"
            $version = [string] $props.Project.PropertyGroup.Version

            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Directory.Build.props must contain a numeric MAJOR.MINOR.PATCH Version."
            }
          }

          "KIVO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: >
          dotnet restore
          src/Kivo.Windows/Kivo.Windows.csproj
          -r win-x64

      - name: Build and publish Windows x64
        run: >
          dotnet publish
          src/Kivo.Windows/Kivo.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Version=$env:KIVO_VERSION
          -o publish/win-x64

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup Compiler (ISCC.exe) was not found on the runner."
          }

          & $iscc "/DMyAppVersion=$env:KIVO_VERSION" "installer\Kivo.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = "artifacts\installer\Kivo-Setup-$env:KIVO_VERSION.exe"
          $publishedExe = "publish\win-x64\Kivo.exe"

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Expected installer was not created: $installer"
          }

          foreach ($requiredFile in @($publishedExe, "publish\win-x64\coreclr.dll", "publish\win-x64\hostfxr.dll")) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Self-contained publish file is missing: $requiredFile"
            }
          }

          $file = Get-Item -LiteralPath $installer
          if ($file.Length -le 0) {
            throw "Installer is empty: $installer"
          }

          $appVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($publishedExe).ProductVersion.Trim()
          $installerVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer).ProductVersion.Trim()

          if (-not $appVersion.StartsWith($env:KIVO_VERSION, [StringComparison]::Ordinal)) {
            throw "Published app version '$appVersion' does not match '$env:KIVO_VERSION'."
          }

          if ($installerVersion -ne $env:KIVO_VERSION) {
            throw "Installer version '$installerVersion' does not match '$env:KIVO_VERSION'."
          }

          Write-Host "Verified installer: $($file.Name) ($($file.Length) bytes), version $installerVersion"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Kivo-Windows-installer
          path: artifacts/installer/Kivo-Setup-*.exe
          if-no-files-found: error

  android:
    name: Android release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android build
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - windows
      - android
    runs-on: ubuntu-latest
    if: github.repository == 'aoyn1xw/Kivo'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: Kivo-Windows-installer
          path: release-assets/windows

      - name: Download Android build
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: release-assets/android

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          WINDOWS_INSTALLER="$(find release-assets/windows -maxdepth 1 -type f -name 'Kivo-Setup-*.exe' | head -n 1)"
          if [ -z "$WINDOWS_INSTALLER" ]; then
            echo "::error::Windows installer not found"
            exit 1
          fi

          cp "$WINDOWS_INSTALLER" "dist/$(basename "$WINDOWS_INSTALLER")"

          APK_FILE="$(find release-assets/android -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::Android APK not found"
            exit 1
          fi

          cp "$APK_FILE" dist/Kivo-Android.apk
          ls -lh dist

      - name: Update and verify rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<'NOTES'
          Automated latest build from `main` commit `${{ github.sha }}`.

          ## Downloads

          - **Windows Desktop:** `Kivo-Setup-${{ needs.windows.outputs.version }}.exe`
          - **Android:** `Kivo-Android.apk`

          ## iOS

          This release does not contain an iOS artifact rebuilt from this commit.
          A `Kivo.ipa` asset, when present, is the most recent signed build published by the `iOS Signed OTA Build` workflow.
          NOTES

          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/.github/scripts/github_api.sh"

          RELEASE_STATUS="$(api_http_status "repos/$GITHUB_REPOSITORY/releases/tags/latest")"
          if ! classify_http_status "$RELEASE_STATUS" "the rolling latest release"; then
            exit 1
          fi

          TAG_STATUS="$(api_http_status "repos/$GITHUB_REPOSITORY/git/ref/tags/latest")"
          if ! classify_http_status "$TAG_STATUS" "the 'latest' tag ref"; then
            exit 1
          fi

          if [ "$TAG_STATUS" = "200" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/latest" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [ "$RELEASE_STATUS" = "404" ]; then
            gh release create latest \
              --title "Kivo (Latest Build)" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi

          # Preserve existing release and Kivo.ipa in place; overwrite fresh assets.
          gh release upload latest dist/* --clobber
          gh release edit latest \
            --title "Kivo (Latest Build)" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" > release-assets/latest.json
          mkdir -p verify

          for asset in dist/*; do
            name="$(basename "$asset")"
            local_size="$(stat -c %s "$asset")"
            published_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' release-assets/latest.json)"
            published_state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' release-assets/latest.json)"

            if [ "$published_size" != "$local_size" ] || [ "$published_state" != "uploaded" ]; then
              echo "::error::Published asset metadata mismatch for $name (size=$published_size/$local_size, state=$published_state)"
              exit 1
            fi

            rm -f "verify/$name"
            gh release download latest --pattern "$name" --dir verify --clobber
            if ! cmp -s "$asset" "verify/$name"; then
              echo "::error::Published asset byte comparison failed for $name"
              exit 1
            fi
          done

          # Prune superseded assets only after fresh assets are verified byte-for-byte.
          LATEST_ASSETS="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
              --jq '.assets[] | "\(.id)\t\(.name)"'
          )"

          if [ -n "$LATEST_ASSETS" ]; then
            while IFS=$'\t' read -r asset_id asset_name; do
              if [ "$asset_name" = "Kivo.ipa" ] || [ -f "dist/$asset_name" ]; then
                continue
              fi
              echo "Removing superseded asset: $asset_name"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done <<< "$LATEST_ASSETS"
          fi

          REMAINING_ASSETS="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
              --jq '.assets[].name'
          )"

          if [ -n "$REMAINING_ASSETS" ]; then
            while IFS= read -r asset_name; do
              if [ "$asset_name" != "Kivo.ipa" ] && [ ! -f "dist/$asset_name" ]; then
                echo "::error::Superseded asset survived pruning: $asset_name"
                exit 1
              fi
            done <<< "$REMAINING_ASSETS"
          fi

          RELEASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq '.object.sha')"
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::latest points to $RELEASE_SHA instead of $GITHUB_SHA"
            exit 1
          fi

          PRERELEASE="$(gh release view latest --json isPrerelease --jq '.isPrerelease')"
          if [ "$PRERELEASE" != "true" ]; then
            echo "::error::latest is not marked as a prerelease"
            exit 1
          fi

      - name: Create or update versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true
          draft: false
          prerelease: false
          generate_release_notes: true
