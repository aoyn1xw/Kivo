name: iOS Signed OTA Build

on:
  workflow_dispatch:

# Serialize rolling `latest` release updates across ios-ota.yml and release.yml.
concurrency:
  group: latest-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build-ios:
    name: Build signed iOS OTA IPA
    runs-on: macos-15
    if: github.repository == 'aoyn1xw/Kivo'

    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::iOS OTA publication must run from the 'main' branch (dispatched from '$GITHUB_REF_NAME')."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::P12_BASE64 is missing"
            exit 1
          fi

          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::P12_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${PROVISION_BASE64:-}" ]; then
            echo "::error::PROVISION_BASE64 is missing"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/original.p12"
          NORMALIZED_P12="$RUNNER_TEMP/signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/signing.pem"

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          ARCHIVE_PATH="$RUNNER_TEMP/Kivo.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"

          export CERTIFICATE_PATH
          export PROFILE_PATH
          export P12_BASE64
          export PROVISION_BASE64

          python3 <<'PY'
          import base64
          import os

          with open(os.environ["CERTIFICATE_PATH"], "wb") as f:
              f.write(base64.b64decode(os.environ["P12_BASE64"].strip()))

          with open(os.environ["PROFILE_PATH"], "wb") as f:
              f.write(base64.b64decode(os.environ["PROVISION_BASE64"].strip()))
          PY

          echo "Decoded P12 size:"
          wc -c "$CERTIFICATE_PATH"

          echo "Decoded provisioning profile size:"
          wc -c "$PROFILE_PATH"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate is empty"
            exit 1
          fi

          if [ ! -s "$PROFILE_PATH" ]; then
            echo "::error::Decoded provisioning profile is empty"
            exit 1
          fi

          if openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -info \
            -noout
          then
            PKCS12_LEGACY=""
          else
            echo "Trying PKCS12 legacy mode"

            openssl pkcs12 \
              -legacy \
              -in "$CERTIFICATE_PATH" \
              -passin "pass:$P12_PASSWORD" \
              -info \
              -noout

            PKCS12_LEGACY="-legacy"
          fi

          openssl pkcs12 \
            $PKCS12_LEGACY \
            -in "$CERTIFICATE_PATH" \
            -passin "pass:$P12_PASSWORD" \
            -nodes \
            -out "$CERTIFICATE_PEM"

          openssl pkcs12 \
            -export \
            -in "$CERTIFICATE_PEM" \
            -out "$NORMALIZED_P12" \
            -passout "pass:$P12_PASSWORD"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$NORMALIZED_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(
            security list-keychains -d user \
              | tr -d '"' \
              | tr '\n' ' '
          )"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "Installed signing identities:"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          CERT_SHA="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" \
            | grep '"Apple Distribution:' \
            | head -n 1 \
            | awk '{print $2}'
          )"

          if [ -z "$CERT_SHA" ]; then
            echo "::error::Apple Distribution identity was not found"
            exit 1
          fi

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )"

          PROFILE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )"

          TEAM_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )"

          APPLICATION_IDENTIFIER="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )"

          BUNDLE_ID="${APPLICATION_IDENTIFIER#${TEAM_ID}.}"

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Certificate SHA: $CERT_SHA"

          if [ -z "$PROFILE_UUID" ] || \
             [ -z "$PROFILE_NAME" ] || \
             [ -z "$TEAM_ID" ] || \
             [ -z "$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile metadata is incomplete"
            exit 1
          fi

          if [ "$BUNDLE_ID" != "app.winter6686.date9988" ]; then
            echo "::error::Provisioning profile bundle ID does not match the app"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy \
            -c "Print :ProvisionedDevices:0" \
            "$PROFILE_PLIST" \
            >/dev/null 2>&1
          then
            echo "::error::This does not appear to be an Ad Hoc provisioning profile"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>$CERT_SHA</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$EXPORT_PATH" >> "$GITHUB_ENV"

          rm -f "$CERTIFICATE_PEM"
          rm -f "$CERTIFICATE_PATH"

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Prepare Flutter iOS build
        working-directory: flutter
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign

      - name: Configure Runner signing
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          export PROFILE_NAME
          export TEAM_ID
          export BUNDLE_ID
          export CERT_SHA
          export KEYCHAIN_PATH

          ruby <<'RUBY'
          require "xcodeproj"

          project = Xcodeproj::Project.open("Runner.xcodeproj")

          runner = project.targets.find do |target|
            target.name == "Runner"
          end

          abort "Runner target not found" unless runner

          release = runner.build_configurations.find do |config|
            config.name == "Release"
          end

          abort "Runner Release configuration not found" unless release

          settings = release.build_settings

          settings["CODE_SIGN_STYLE"] = "Manual"
          settings["CODE_SIGN_IDENTITY"] = ENV.fetch("CERT_SHA")
          settings["DEVELOPMENT_TEAM"] = ENV.fetch("TEAM_ID")
          settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("BUNDLE_ID")
          settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_NAME")
          settings.delete("PROVISIONING_PROFILE")

          project.save

          puts "Configured signing for Runner Release only"
          puts "Bundle ID: #{ENV.fetch("BUNDLE_ID")}"
          puts "Team ID: #{ENV.fetch("TEAM_ID")}"
          puts "Profile: #{ENV.fetch("PROFILE_NAME")}"
          RUBY

      - name: Inspect signing settings
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER"

      - name: Archive signed iOS app
        working-directory: flutter/ios
        run: |
          set -euo pipefail

          rm -rf "$ARCHIVE_PATH"

          security unlock-keychain \
            -p "" \
            "$KEYCHAIN_PATH" \
            2>/dev/null || true

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive

      - name: Verify signed archive
        run: |
          set -euo pipefail

          APP_PATH="$ARCHIVE_PATH/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app was not created"
            exit 1
          fi

          echo "Code signature:"

          codesign \
            -dvvv \
            "$APP_PATH" \
            2>&1 \
            | grep -E \
              "Identifier=|Authority=|TeamIdentifier="

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "::error::Archive has no embedded provisioning profile"
            exit 1
          fi

          security cms \
            -D \
            -i "$APP_PATH/embedded.mobileprovision" \
            > "$RUNNER_TEMP/embedded-profile.plist"

          EMBEDDED_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/embedded-profile.plist"
          )"

          EMBEDDED_APP_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/embedded-profile.plist"
          )"

          echo "Embedded profile UUID: $EMBEDDED_UUID"
          echo "Embedded application identifier: $EMBEDDED_APP_ID"

          if [ "$EMBEDDED_UUID" != "$PROFILE_UUID" ]; then
            echo "::error::Wrong provisioning profile was embedded"
            exit 1
          fi

      - name: Export signed IPA
        run: |
          set -euo pipefail

          rm -rf "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Stage and verify signed IPA
        run: |
          set -euo pipefail

          IPA_FILE="$(
            find "$EXPORT_PATH" \
              -type f \
              -name "*.ipa" \
              | head -n 1
          )"

          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA was produced"
            find "$EXPORT_PATH" -maxdepth 3 -type f || true
            exit 1
          fi

          mkdir -p output
          cp "$IPA_FILE" output/Kivo.ipa
          ls -lh output/Kivo.ipa

          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_ipa.py" \
            output/Kivo.ipa \
            "$BUNDLE_ID" \
            "$TEAM_ID" \
            "$PROFILE_UUID" \
            flutter/pubspec.yaml \
            flutter/ios/Runner.xcodeproj/project.pbxproj

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kivo-signed-iOS
          path: output/Kivo.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified IPA to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/.github/scripts/github_api.sh"

          RELEASE_STATUS="$(api_http_status "repos/$GITHUB_REPOSITORY/releases/tags/latest")"

          if ! classify_http_status "$RELEASE_STATUS" "the rolling latest release"; then
            exit 1
          fi

          if [ "$RELEASE_STATUS" = "404" ]; then
            gh release create latest \
              --title "Kivo iOS OTA" \
              --notes "Signed Kivo iOS OTA build." \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          fi

          gh release upload latest output/Kivo.ipa --clobber

          cat > "$RUNNER_TEMP/ota-release-notes.md" <<EOF
          Signed Kivo iOS OTA build.

          - Source commit: $GITHUB_SHA
          - Bundle identifier: $BUNDLE_ID
          - App version: $IPA_APP_VERSION (build $IPA_BUILD_NUMBER)
          - Minimum iOS version: $IPA_MIN_OS_VERSION
          - IPA SHA-256: $IPA_SHA256
          - Signing: ad-hoc IPA signed with an Apple Distribution certificate;
            install only on devices listed in the provisioning profile.
          EOF

          gh release edit latest \
            --notes-file "$RUNNER_TEMP/ota-release-notes.md" \
            --prerelease \
            --latest=false

      - name: Generate and publish OTA manifest
        run: |
          set -euo pipefail

          mkdir -p docs

          cat > docs/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>

                              <key>url</key>
                              <string>https://github.com/$GITHUB_REPOSITORY/releases/download/latest/Kivo.ipa</string>
                          </dict>
                      </array>

                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>$BUNDLE_ID</string>

                          <key>bundle-version</key>
                          <string>$IPA_BUILD_NUMBER</string>

                          <key>kind</key>
                          <string>software</string>

                          <key>title</key>
                          <string>Kivo</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          plutil -lint docs/manifest.plist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PAGES_REQUEST_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if git diff --quiet -- docs/manifest.plist; then
            MANIFEST_SHA="$GITHUB_SHA"
          else
            git add docs/manifest.plist
            git commit -m "chore: update iOS OTA manifest"
            git push
            MANIFEST_SHA="$(git rev-parse HEAD)"
          fi

          echo "Manifest commit: $MANIFEST_SHA"
          echo "MANIFEST_SHA=$MANIFEST_SHA" >> "$GITHUB_ENV"
          echo "PAGES_REQUEST_AT=$PAGES_REQUEST_AT" >> "$GITHUB_ENV"

      - name: Trigger and verify Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_URL: https://aoyn1xw.github.io/Kivo/manifest.plist
          IPA_URL: https://github.com/aoyn1xw/Kivo/releases/download/latest/Kivo.ipa
        run: |
          set -euo pipefail

          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/.github/scripts/github_api.sh"

          PAGES_STATUS="$(api_http_status "repos/$GITHUB_REPOSITORY/pages")"
          if ! classify_http_status "$PAGES_STATUS" "GitHub Pages configuration"; then
            exit 1
          fi
          if [ "$PAGES_STATUS" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for $GITHUB_REPOSITORY (enable 'Deploy from a branch: main /docs')."
            exit 1
          fi

          PAGES_BUILD_TYPE="$(jq -r '.build_type // "unknown"' "$RUNNER_TEMP/github-api-body.json")"
          if [ "$PAGES_BUILD_TYPE" = "workflow" ]; then
            echo "::error::GitHub Pages uses build_type=workflow; set source to 'Deploy from a branch: main /docs'."
            exit 1
          fi

          : "${PAGES_REQUEST_AT:=$(date -u +%Y-%m-%dT%H:%M:%SZ)}"

          # Pushing with GITHUB_TOKEN does not automatically trigger a legacy Pages build.
          TRIGGER_CODE="$(curl -sS \
            -o "$RUNNER_TEMP/pages-trigger.json" \
            -w '%{http_code}' \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" \
            || true
          )"

          TRIGGER_BUILD_URL=""
          case "${TRIGGER_CODE:-000}" in
            2??)
              TRIGGER_BUILD_URL="$(jq -r '.url // empty' "$RUNNER_TEMP/pages-trigger.json" 2>/dev/null || true)"
              ;;
            409)
              ;;
            *)
              echo "::error::Could not trigger GitHub Pages build (HTTP ${TRIGGER_CODE:-000})."
              exit 1
              ;;
          esac

          BUILT=0
          for attempt in $(seq 1 40); do
            BUILDS_CODE="$(api_http_status "repos/$GITHUB_REPOSITORY/pages/builds?per_page=30")"
            if [ "$BUILDS_CODE" = "200" ]; then
              BUILD_STATE="$(pages_commit_build_status "$RUNNER_TEMP/github-api-body.json" "$MANIFEST_SHA" "$PAGES_REQUEST_AT" "$TRIGGER_BUILD_URL")"
              STATUS="${BUILD_STATE%%$'\t'*}"
              ERR_MSG="${BUILD_STATE#*$'\t'}"
              echo "Pages build for $MANIFEST_SHA (attempt $attempt): $STATUS"

              case "$STATUS" in
                built)
                  BUILT=1
                  break
                  ;;
                errored)
                  echo "::error::GitHub Pages build failed for $MANIFEST_SHA: $ERR_MSG"
                  exit 1
                  ;;
                queued|building|none)
                  ;;
                *)
                  echo "::error::Unexpected Pages build status response: $BUILD_STATE"
                  exit 1
                  ;;
              esac
            fi
            sleep 15
          done

          if [ "$BUILT" != "1" ]; then
            echo "::error::GitHub Pages did not finish building commit $MANIFEST_SHA within 10 minutes."
            exit 1
          fi

          DEPLOYED="$RUNNER_TEMP/deployed-manifest.plist"
          curl -sS --fail --location --max-time 60 "$MANIFEST_URL?sha=$MANIFEST_SHA" -o "$DEPLOYED"
          if ! cmp -s docs/manifest.plist "$DEPLOYED"; then
            echo "::error::Deployed manifest at $MANIFEST_URL does not match docs/manifest.plist"
            exit 1
          fi

          VERIFY_DIR="$RUNNER_TEMP/ota-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          gh release download latest --pattern 'Kivo.ipa' --dir "$VERIFY_DIR" --clobber

          PUBLISHED_SHA256="$(shasum -a 256 "$VERIFY_DIR/Kivo.ipa" | awk '{print $1}')"
          if [ "$PUBLISHED_SHA256" != "$IPA_SHA256" ]; then
            echo "::error::Published Kivo.ipa SHA-256 ($PUBLISHED_SHA256) does not match verified build ($IPA_SHA256)"
            exit 1
          fi

          curl --fail --location --silent --show-error --head "$IPA_URL" >/dev/null
          echo "Verified OTA manifest and IPA endpoints for commit $MANIFEST_SHA"

      - name: Print install information
        run: |
          echo "Install page: https://aoyn1xw.github.io/Kivo/"
          echo "Manifest:     https://aoyn1xw.github.io/Kivo/manifest.plist"
          echo "Signed IPA:   https://github.com/aoyn1xw/Kivo/releases/download/latest/Kivo.ipa"

      - name: Clean up signing files
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && \
             [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain \
              "$KEYCHAIN_PATH" \
              || true
          fi

          rm -f "$RUNNER_TEMP/original.p12"
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/embedded-profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
